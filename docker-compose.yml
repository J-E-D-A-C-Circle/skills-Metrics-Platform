# =============================================================================
# docker-compose.yml · Local Full Stack (MySQL 8 + Next.js App + phpMyAdmin)
# Usage:
#   docker compose up -d          # Start database, app, and phpMyAdmin
#   docker compose up -d db       # Start only the database (for local npm run dev)
#   docker compose exec app npm run db:seed # Seed initial administrative & framework data
# =============================================================================
services:
  db:
    image: mysql:8.0
    container_name: skm-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skill_matrix}
      MYSQL_USER: ${MYSQL_USER:-skm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - skm-mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-skm}", "-p${MYSQL_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skm-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-skm}:${MYSQL_PASSWORD:-change-me}@db:3306/${MYSQL_DATABASE:-skill_matrix}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@dvla.gov.gh}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Administrator}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Password123!}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JOBS_SECRET: ${JOBS_SECRET:-}
      STORAGE_DIR: /app/storage
    volumes:
      - app-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: skm-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8085}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-skm}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  skm-mysql-data:
  app-storage:

